<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Pinned picture</title>
<link rel="stylesheet" href="brand.css">
<style>
  html, body { background: #fff; cursor: move; }
  /* The picture fills the window; not draggable as an image (dragging moves the window). */
  #pic { position: fixed; inset: 0; width: 100%; height: 100%; display: block; object-fit: fill; -webkit-user-drag: none; pointer-events: none; }
  body:hover::after { content: ""; position: fixed; inset: 0; box-shadow: inset 0 0 0 1px var(--accent); pointer-events: none; }
</style>
</head>
<body>
  <img id="pic" alt="" draggable="false">
  <script src="common.js"></script>
  <script src="pin.js"></script>
</body>
</html>
